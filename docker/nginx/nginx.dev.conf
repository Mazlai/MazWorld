server {
    listen 80;
    server_name _;

    location /api {
        fastcgi_pass backend:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
    }

    location / {
        proxy_pass http://frontend:4200;
        # Host figé à "localhost", pas $host : le serveur de dev Angular a son propre
        # filtre de sécurité (anti DNS rebinding) et renvoie 403 si le Host reçu ne fait
        # pas partie de sa liste connue. Un appelant interne comme Uptime Kuma envoie
        # "Host: nginx" (le nom du service Docker), que ce filtre rejetterait sinon.
        proxy_set_header Host localhost;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Port interne au réseau Docker (non publié côté hôte) : réservé au scrape Prometheus,
# jamais exposé publiquement via ce serveur ni via le bloc 80 ci-dessus.
server {
    listen 8081;
    server_name _;

    location /metrics {
        fastcgi_pass backend:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
    }
}
