name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1 : Création du tag Git et de la GitHub Release
  # ─────────────────────────────────────────────────────────────────────────────
  create-tag-and-release:
    name: Create Tag & GitHub Release
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./web/frontend/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version detected: $VERSION"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          git tag -a "v${{ steps.version.outputs.version }}" \
            -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Le corps de la PR "release: vX.Y.Z" est rédigé à la main (résumé, correctifs,
          # tests) et bien plus riche que ce que --generate-notes peut produire ici : les
          # PR de release sont fusionnées en squash merge dans main, ce qui aplatit
          # l'historique détaillé — l'algorithme de GitHub n'a alors plus qu'un seul commit
          # à énumérer et ne produit qu'une ligne ("release: vX.Y.Z by @auteur"). On passe
          # donc explicitement par env: (jamais d'interpolation ${{ }} directe dans un run:,
          # le corps de la PR étant un contenu utilisateur non fiable) plutôt que par le
          # shell, et on ne retombe sur --generate-notes que si la PR n'a exceptionnellement
          # aucune description.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -n "$PR_BODY" ]; then
            printf '%s\n' "$PR_BODY" > release-notes.md
            gh release create "v${{ steps.version.outputs.version }}" \
              --title "Release v${{ steps.version.outputs.version }}" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "v${{ steps.version.outputs.version }}" \
              --title "Release v${{ steps.version.outputs.version }}" \
              --generate-notes \
              --latest
          fi